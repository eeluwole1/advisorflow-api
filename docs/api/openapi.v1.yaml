openapi: 3.1.0
info:
  title: AdvisorFlow API
  version: 1.4.0
  summary: Household CRM API consumed by advisorflow-web.
  description: |
    Versioned contract between advisorflow-api and advisorflow-web (blueprint v1.3 §11.5A).

    Versioning rules:
    - PATCH (1.0.x): wording, examples, documentation only.
    - MINOR (1.x.0): backward-compatible additions — new endpoints, new optional fields,
      new optional query parameters.
    - MAJOR (2.0.0): anything that can break the frontend — renamed/removed fields,
      changed types, new required inputs. Served side by side under a new path prefix.

    All records are fictional. `riskProfile` is a CRM classification tag, not an
    investment suitability assessment.

    Changes:
    - 1.1.0 (M3): `POST /api/households` and `PUT /api/households/{id}`. There is no
      delete; a household is deactivated by setting `clientStatus` to `Inactive` (ADR-008).
    - 1.2.0 (M3): `POST /api/households/{id}/contacts` and
      `PUT /api/households/{id}/contacts/{contactId}`, with the primary-member rule (BR-HH-003).
    - 1.2.1: documents `403` on create/update when a deployment is read-only (ADR-009).
    - 1.3.0 (M4): advisory opportunities. `GET /api/opportunities` (the pipeline),
      `GET /api/opportunities/{id}`, `GET` and `POST /api/households/{id}/opportunities`, and
      `PUT /api/opportunities/{id}`, with BR-OP-001 to BR-OP-004 (ADR-010). No delete: an
      opportunity ends as Closed Won or Closed Lost.
    - 1.4.0 (M5): follow-up tasks, read-only. `GET /api/activities` (open, overdue, closed or all),
      `GET /api/households/{id}/activities` and `GET /api/opportunities/{id}/activities`.
      Tasks are created in Salesforce, by people or by the follow-up Flow (ADR-011).
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: http://localhost:5080
    description: Local development
tags:
  - name: Health
    description: Service liveness.
  - name: Households
    description: Households (Salesforce Accounts) and their members (Contacts).
  - name: Opportunities
    description: Advisory opportunities (Salesforce Opportunities) for households.
  - name: Activities
    description: Follow-up tasks (Salesforce Tasks) on households and their opportunities.
paths:
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Liveness check
      security: []
      responses:
        '200':
          description: The API is running.
          content:
            text/plain:
              schema:
                type: string
                examples: [Healthy]
  /api/households:
    get:
      tags: [Households]
      operationId: listHouseholds
      summary: Paginated household summaries
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: search
          in: query
          description: Case-insensitive match on household name.
          schema: { type: string, maxLength: 80 }
        - name: status
          in: query
          description: Approved Client Status values only (BR-CL-001).
          schema: { $ref: '#/components/schemas/ClientStatus' }
      responses:
        '200':
          description: One page of households, ordered by name.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HouseholdSummaryPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '502': { $ref: '#/components/responses/UpstreamError' }
        '503': { $ref: '#/components/responses/Unavailable' }
    post:
      tags: [Households]
      operationId: createHousehold
      summary: Create a household
      description: Added in 1.1.0. `clientStatus` defaults to `Prospect`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HouseholdCreate' }
      responses:
        '201':
          description: The household was created.
          headers:
            Location:
              description: URL of the new household.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HouseholdDetail' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/ReadOnly' }
        '502': { $ref: '#/components/responses/UpstreamError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/households/{id}:
    put:
      tags: [Households]
      operationId: updateHousehold
      summary: Replace a household's editable fields
      description: |
        Added in 1.1.0. Every editable field is replaced: an omitted or empty optional
        field is cleared. Set `clientStatus` to `Inactive` to deactivate (ADR-008).
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HouseholdUpdate' }
      responses:
        '200':
          description: The updated household.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HouseholdDetail' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/ReadOnly' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/UpstreamError' }
        '503': { $ref: '#/components/responses/Unavailable' }
    get:
      tags: [Households]
      operationId: getHousehold
      summary: Household detail
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
      responses:
        '200':
          description: The household.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HouseholdDetail' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/UpstreamError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/households/{id}/contacts:
    get:
      tags: [Households]
      operationId: listHouseholdMembers
      summary: Household members, primary member first
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
      responses:
        '200':
          description: Members of the household; empty when it has none.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/HouseholdMember' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/UpstreamError' }
        '503': { $ref: '#/components/responses/Unavailable' }
    post:
      tags: [Households]
      operationId: createHouseholdMember
      summary: Add a member to a household
      description: |
        Added in 1.2.0. The household's first member becomes primary automatically; a later
        member is primary only when `isPrimary` is true, which also clears the previous
        primary in the same all-or-nothing change (BR-HH-003).
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MemberWrite' }
      responses:
        '201':
          description: The member was added.
          headers:
            Location:
              description: URL of the household's member list.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HouseholdMember' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/ReadOnly' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/UpstreamError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/households/{id}/contacts/{contactId}:
    put:
      tags: [Households]
      operationId: updateHouseholdMember
      summary: Replace a member's editable fields
      description: |
        Added in 1.2.0. Every editable field is replaced: an omitted or empty optional field is
        cleared. `isPrimary: true` makes this member the primary and clears the previous one.
        The current primary cannot be un-set (400 with an `isPrimary` error); make another
        member primary instead (BR-HH-003). Members cannot be moved or removed.
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
        - $ref: '#/components/parameters/ContactId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MemberWrite' }
      responses:
        '200':
          description: The updated member.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HouseholdMember' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/ReadOnly' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/UpstreamError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/households/{id}/opportunities:
    get:
      tags: [Opportunities]
      operationId: listHouseholdOpportunities
      summary: A household's opportunities, ordered by close date
      description: Added in 1.3.0.
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
      responses:
        '200':
          description: The household's opportunities; empty when it has none.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Opportunity' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/UpstreamError' }
        '503': { $ref: '#/components/responses/Unavailable' }
    post:
      tags: [Opportunities]
      operationId: createOpportunity
      summary: Create an opportunity for a household
      description: |
        Added in 1.3.0. `stage` defaults to `Prospecting`. Closed Lost needs a `lossReason`,
        and only Closed Lost may have one (BR-OP-001, BR-OP-002).
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OpportunityCreate' }
      responses:
        '201':
          description: The opportunity was created.
          headers:
            Location:
              description: URL of the new opportunity.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Opportunity' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/ReadOnly' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/UpstreamError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/opportunities:
    get:
      tags: [Opportunities]
      operationId: listOpportunities
      summary: The opportunity pipeline
      description: Added in 1.3.0. Ordered by close date, then name.
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: search
          in: query
          description: Case-insensitive match on opportunity name.
          schema: { type: string, maxLength: 80 }
        - name: stage
          in: query
          description: One stage only. Matching is case-insensitive.
          schema: { $ref: '#/components/schemas/OpportunityStage' }
        - name: householdId
          in: query
          description: Only this household's opportunities.
          schema: { type: string, pattern: '^[a-zA-Z0-9]{15}([a-zA-Z0-9]{3})?$' }
      responses:
        '200':
          description: One page of opportunities.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OpportunityPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '502': { $ref: '#/components/responses/UpstreamError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/opportunities/{id}:
    get:
      tags: [Opportunities]
      operationId: getOpportunity
      summary: Opportunity detail
      description: Added in 1.3.0.
      parameters:
        - $ref: '#/components/parameters/OpportunityId'
      responses:
        '200':
          description: The opportunity.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Opportunity' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/UpstreamError' }
        '503': { $ref: '#/components/responses/Unavailable' }
    put:
      tags: [Opportunities]
      operationId: updateOpportunity
      summary: Replace an opportunity's editable fields
      description: |
        Added in 1.3.0. Every editable field is replaced: an omitted or empty optional field is
        cleared. The stage may stay, move forward any number of stages, or move back one stage;
        a Closed Won or Closed Lost opportunity keeps its stage (400 with a `stage` error,
        BR-OP-004, ADR-010). The household cannot be changed.
      parameters:
        - $ref: '#/components/parameters/OpportunityId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OpportunityUpdate' }
      responses:
        '200':
          description: The updated opportunity.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Opportunity' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/ReadOnly' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/UpstreamError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/activities:
    get:
      tags: [Activities]
      operationId: listActivities
      summary: Follow-up tasks across households
      description: |
        Added in 1.4.0. Open tasks come before closed ones, then by due date (undated last),
        then subject. `overdue` means still open with a due date before today in the
        practice's time zone, America/Winnipeg (BR-ACT-003, ADR-012).
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: search
          in: query
          description: Case-insensitive match on the task subject.
          schema: { type: string, maxLength: 80 }
        - name: state
          in: query
          description: Which tasks to list. Matching is case-insensitive.
          schema: { $ref: '#/components/schemas/ActivityState' }
        - name: householdId
          in: query
          description: Only this household's tasks, including those on its opportunities.
          schema: { type: string, pattern: '^[a-zA-Z0-9]{15}([a-zA-Z0-9]{3})?$' }
      responses:
        '200':
          description: One page of tasks.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActivityPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '502': { $ref: '#/components/responses/UpstreamError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/households/{id}/activities:
    get:
      tags: [Activities]
      operationId: listHouseholdActivities
      summary: A household's tasks, including those on its opportunities
      description: Added in 1.4.0. Same order as the task list; open and closed tasks are both returned.
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
      responses:
        '200':
          description: The household's tasks; empty when it has none.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Activity' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/UpstreamError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/opportunities/{id}/activities:
    get:
      tags: [Activities]
      operationId: listOpportunityActivities
      summary: An opportunity's tasks
      description: Added in 1.4.0. Same order as the task list; open and closed tasks are both returned.
      parameters:
        - $ref: '#/components/parameters/OpportunityId'
      responses:
        '200':
          description: The opportunity's tasks; empty when it has none.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Activity' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/UpstreamError' }
        '503': { $ref: '#/components/responses/Unavailable' }
components:
  parameters:
    HouseholdId:
      name: id
      in: path
      required: true
      description: 15- or 18-character Salesforce Account id.
      schema: { type: string, pattern: '^[a-zA-Z0-9]{15}([a-zA-Z0-9]{3})?$' }
    ContactId:
      name: contactId
      in: path
      required: true
      description: 15- or 18-character Salesforce Contact id of a member of this household.
      schema: { type: string, pattern: '^[a-zA-Z0-9]{15}([a-zA-Z0-9]{3})?$' }
    OpportunityId:
      name: id
      in: path
      required: true
      description: 15- or 18-character Salesforce Opportunity id.
      schema: { type: string, pattern: '^[a-zA-Z0-9]{15}([a-zA-Z0-9]{3})?$' }
  schemas:
    ClientStatus:
      type: string
      enum: [Prospect, Active, Inactive]
    RiskProfile:
      type: string
      description: CRM classification tag only. Matching is case-insensitive on input.
      enum: [Conservative, Moderate, Aggressive]
    Priority:
      type: string
      description: Matching is case-insensitive on input.
      enum: [High, Medium, Low]
    HouseholdCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        clientStatus:
          description: Defaults to Prospect when omitted (BR-CL-001).
          $ref: '#/components/schemas/ClientStatus'
        riskProfile:
          oneOf:
            - $ref: '#/components/schemas/RiskProfile'
            - type: 'null'
        priority:
          oneOf:
            - $ref: '#/components/schemas/Priority'
            - type: 'null'
        phone: { type: [string, 'null'], maxLength: 40 }
    HouseholdUpdate:
      description: Same fields as HouseholdCreate; `clientStatus` is required because PUT replaces every field.
      allOf:
        - $ref: '#/components/schemas/HouseholdCreate'
        - type: object
          required: [clientStatus]
    ContactMethod:
      type: string
      description: Matching is case-insensitive on input. Not the same as marketing consent (BR-SEC-002).
      enum: [Email, Phone, SMS]
    MemberWrite:
      type: object
      description: |
        Email needs `email`; Phone and SMS need `phone`. On PUT an omitted or empty optional
        field is cleared, and an omitted `isPrimary` means false.
      required: [lastName]
      properties:
        firstName: { type: [string, 'null'], maxLength: 40 }
        lastName: { type: string, minLength: 1, maxLength: 80 }
        email: { type: [string, 'null'], format: email, maxLength: 80 }
        phone: { type: [string, 'null'], maxLength: 40 }
        preferredContactMethod:
          oneOf:
            - $ref: '#/components/schemas/ContactMethod'
            - type: 'null'
        isPrimary: { type: [boolean, 'null'] }
    HouseholdSummary:
      type: object
      required: [id, name, clientStatus, riskProfile, priority, memberCount, primaryContactName]
      properties:
        id: { type: string }
        name: { type: string }
        clientStatus: { $ref: '#/components/schemas/ClientStatus' }
        riskProfile: { type: [string, 'null'], description: CRM classification tag only. }
        priority: { type: [string, 'null'] }
        memberCount: { type: integer, minimum: 0 }
        primaryContactName: { type: [string, 'null'] }
    HouseholdSummaryPage:
      type: object
      required: [items, page, pageSize, totalCount, totalPages]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/HouseholdSummary' }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1 }
        totalCount: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
    HouseholdDetail:
      type: object
      required: [id, name, clientStatus, riskProfile, priority, phone, accountNumber, memberCount]
      properties:
        id: { type: string }
        name: { type: string }
        clientStatus: { $ref: '#/components/schemas/ClientStatus' }
        riskProfile: { type: [string, 'null'], description: CRM classification tag only. }
        priority: { type: [string, 'null'] }
        phone: { type: [string, 'null'] }
        accountNumber: { type: [string, 'null'] }
        memberCount: { type: integer, minimum: 0 }
    HouseholdMember:
      type: object
      required: [id, householdId, firstName, lastName, fullName, email, phone, preferredContactMethod, isPrimary]
      properties:
        id: { type: string }
        householdId: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        fullName: { type: string }
        email: { type: [string, 'null'] }
        phone: { type: [string, 'null'] }
        preferredContactMethod:
          type: [string, 'null']
          description: Email, Phone or SMS. Not the same as marketing consent (BR-SEC-002).
        isPrimary: { type: boolean }
    OpportunityStage:
      type: string
      description: |
        The AdvisorFlow Advisory sales process, in pipeline order (blueprint §9). Matching is
        case-insensitive on input. Closed Won and Closed Lost are final (BR-OP-004).
      enum: [Prospecting, Qualification, Needs Assessment, Proposal Presented, Negotiation/Review, Closed Won, Closed Lost]
    ServiceType:
      type: string
      description: Matching is case-insensitive on input.
      enum: [Retirement Planning, Investment Advisory, Financial Review, Other]
    LossReason:
      type: string
      description: Matching is case-insensitive on input. Required for Closed Lost only (BR-OP-002).
      enum: [Chose another advisor, Fees, Timing, Needs changed, No response, Other]
    OpportunityCreate:
      type: object
      required: [name, closeDate]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        stage:
          description: Defaults to Prospecting when omitted.
          $ref: '#/components/schemas/OpportunityStage'
        closeDate: { type: string, format: date, description: 'Expected close date, yyyy-MM-dd (BR-OP-001).' }
        amount:
          type: [number, 'null']
          minimum: 0
          multipleOf: 0.01
          description: Estimated advisory service revenue, not assets under management (BR-OP-003).
        serviceType:
          oneOf:
            - $ref: '#/components/schemas/ServiceType'
            - type: 'null'
        engagementPriority:
          oneOf:
            - $ref: '#/components/schemas/Priority'
            - type: 'null'
        nextStep: { type: [string, 'null'], maxLength: 255 }
        lossReason:
          oneOf:
            - $ref: '#/components/schemas/LossReason'
            - type: 'null'
    OpportunityUpdate:
      description: Same fields as OpportunityCreate; `stage` is required because PUT replaces every field.
      allOf:
        - $ref: '#/components/schemas/OpportunityCreate'
        - type: object
          required: [stage]
    Opportunity:
      type: object
      required: [id, householdId, householdName, name, stage, isClosed, closeDate, amount, probability, serviceType, engagementPriority, nextStep, lossReason]
      properties:
        id: { type: string }
        householdId: { type: string }
        householdName: { type: string }
        name: { type: string }
        stage: { $ref: '#/components/schemas/OpportunityStage' }
        isClosed: { type: boolean, description: True for Closed Won and Closed Lost. }
        closeDate: { type: string, format: date }
        amount:
          type: [number, 'null']
          description: Estimated advisory service revenue, not assets under management (BR-OP-003).
        probability:
          type: [integer, 'null']
          minimum: 0
          maximum: 100
          description: Percent, set by Salesforce from the stage. Read-only.
        serviceType: { type: [string, 'null'] }
        engagementPriority: { type: [string, 'null'] }
        nextStep: { type: [string, 'null'] }
        lossReason: { type: [string, 'null'], description: Set only when the stage is Closed Lost. }
    OpportunityPage:
      type: object
      required: [items, page, pageSize, totalCount, totalPages]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Opportunity' }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1 }
        totalCount: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
    ActivityState:
      type: string
      enum: [open, overdue, closed, all]
      default: open
    Activity:
      type: object
      required: [id, subject, status, priority, dueDate, isClosed, isOverdue, householdId, householdName, relatedToId, relatedToName, relatedToType, contactName, ownerName, automation]
      properties:
        id: { type: string }
        subject: { type: string }
        status:
          type: string
          description: The Salesforce task status, e.g. Not Started, In Progress, Waiting on someone else, Completed.
        priority: { type: [string, 'null'], description: 'High, Normal or Low.' }
        dueDate: { type: [string, 'null'], format: date }
        isClosed: { type: boolean }
        isOverdue:
          type: boolean
          description: Open with a due date before today in America/Winnipeg (BR-ACT-003).
        householdId: { type: string }
        householdName: { type: string }
        relatedToId: { type: [string, 'null'], description: The household or opportunity the task is attached to. }
        relatedToName: { type: [string, 'null'] }
        relatedToType: { type: [string, 'null'], description: '`Household` or `Opportunity`.' }
        contactName: { type: [string, 'null'], description: 'The household member the task is about, if any.' }
        ownerName: { type: [string, 'null'] }
        automation:
          type: [string, 'null']
          description: |
            `Qualification follow-up` or `Proposal review` when the follow-up Flow created the task
            (ADR-011); null when a person logged it.
    ActivityPage:
      type: object
      required: [items, page, pageSize, totalCount, totalPages]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Activity' }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1 }
        totalCount: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
    ProblemDetails:
      type: object
      description: RFC 9457 problem details.
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        traceId: { type: string }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
  responses:
    ValidationError:
      description: Invalid query parameter, id or request body.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    ReadOnly:
      description: |
        This deployment is read-only (`Features:AllowWrites` is false), so no change was made.
        Returned before the body is read (ADR-009).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    NotFound:
      description: The household, the member within it, or the opportunity does not exist.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    UpstreamError:
      description: The CRM returned an error. No upstream detail is exposed.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    Unavailable:
      description: The CRM is unreachable or not configured.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
