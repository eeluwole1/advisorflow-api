name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: .NET build + xUnit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore AdvisorFlow.slnx
      - run: dotnet build AdvisorFlow.slnx --no-restore --configuration Release
      - name: Tests (unit, HTTP integration, contract, architecture)
        run: dotnet test AdvisorFlow.slnx --no-build --configuration Release --logger "trx;LogFileName=api-tests.trx" --results-directory TestResults
      - name: Vulnerable package check
        run: dotnet list AdvisorFlow.slnx package --vulnerable --include-transitive 2>&1 | tee vuln.txt; ! grep -qE "(High|Critical)" vuln.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-results
          path: TestResults

  contract:
    name: OpenAPI contract lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes @redocly/cli@2 lint docs/api/openapi.v1.yaml

  salesforce:
    name: Salesforce metadata + LWC tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate project files
        run: |
          python3 -m json.tool sfdx-project.json > /dev/null
          python3 -c "import xml.dom.minidom; xml.dom.minidom.parse('manifest/baseline-package.xml')"
          python3 -c "import xml.dom.minidom; xml.dom.minidom.parse('manifest/ci-validate-package.xml')"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lightning Web Component tests (Jest)
        run: npm run test:lwc

  salesforce-validate:
    name: Salesforce validate (deploy dry-run + Apex tests)
    # A full deploy of the project's Salesforce source plus every local Apex test, then a
    # rollback (ADR-014). Signs in as the API-only CI user; nothing is saved to the org.
    needs: salesforce
    # Pull requests from forks get no secrets: skip there instead of failing.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      SF_CI_CLIENT_ID: ${{ secrets.SF_CI_CLIENT_ID }}
      SF_CI_JWT_KEY: ${{ secrets.SF_CI_JWT_KEY }}
      SF_CI_USERNAME: ${{ secrets.SF_CI_USERNAME }}
      SF_INSTANCE_URL: https://orgfarm-c274b45e01-dev-ed.develop.my.salesforce.com
      SF_DISABLE_TELEMETRY: "true"
      SF_AUTOUPDATE_DISABLE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli@2
      - name: Sign in as the CI user (JWT bearer flow)
        run: |
          umask 077
          printf '%s\n' "$SF_CI_JWT_KEY" > "$RUNNER_TEMP/ci.key"
          sf org login jwt --client-id "$SF_CI_CLIENT_ID" --jwt-key-file "$RUNNER_TEMP/ci.key" \
            --username "$SF_CI_USERNAME" --instance-url "$SF_INSTANCE_URL" --alias ci
          rm -f "$RUNNER_TEMP/ci.key"
      - name: Validate deploy and run all local Apex tests (nothing is saved)
        run: |
          sf project deploy validate --target-org ci --manifest manifest/ci-validate-package.xml \
            --test-level RunLocalTests --wait 30 \
            --junit --coverage-formatters json-summary --results-dir sf-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: salesforce-validate-results
          path: sf-results
      - name: Sign out
        if: always()
        run: sf org logout --target-org ci --no-prompt || true

  deploy:
    name: Deploy to Azure App Service
    # Only pushes to main, and only after every check above has passed.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [dotnet, contract, salesforce, salesforce-validate]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://app-advisorflow-api-ee1.azurewebsites.net/health
    # A newer push queues behind a running deploy instead of cancelling it half-way.
    concurrency:
      group: deploy-api
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet publish src/AdvisorFlow.Api --configuration Release --output publish
      - uses: azure/webapps-deploy@v3
        with:
          app-name: app-advisorflow-api-ee1
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: publish
      - name: Smoke test
        # The free tier starts the app on demand, so allow a few minutes.
        run: |
          for i in $(seq 1 18); do
            if curl -fsS https://app-advisorflow-api-ee1.azurewebsites.net/health; then echo; exit 0; fi
            sleep 10
          done
          echo "The API did not report Healthy after deploying." >&2
          exit 1
